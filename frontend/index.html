<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Healthcare GPT – Multi-Modal</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100vh;
        background: #0b1f33;
        color: #f5f8fc;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      }
      #boot {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 0.75rem;
        padding: 2rem;
        text-align: center;
      }
      #boot h1 { margin: 0; font-size: 1.75rem; }
      #boot p { margin: 0; color: #b7c7db; }
      #boot .err { color: #ffb4b4; max-width: 36rem; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <h1>Healthcare GPT</h1>
        <p>Loading the app… please wait a few seconds.</p>
        <p id="boot-status" class="err"></p>
      </div>
    </div>
    <script>
      // Show a clear message if the JS bundle fails to load (common cause of black screen)
      window.addEventListener('error', function (e) {
        var el = document.getElementById('boot-status');
        if (el && e && e.target && e.target.tagName === 'SCRIPT') {
          el.textContent = 'Failed to load app scripts. Wait 30–60s (Render free sleep), then hard-refresh (Ctrl+F5).';
        }
      }, true);
      setTimeout(function () {
        var el = document.getElementById('boot-status');
        var boot = document.getElementById('boot');
        if (el && boot && document.getElementById('boot')) {
          el.textContent = 'Still loading… If this stays forever, hard-refresh (Ctrl+F5) or open /health in a new tab.';
        }
      }, 8000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
